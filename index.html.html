<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樂理互動探索器 Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #111827;
            --card-bg: #1e293b;
            --accent-yellow: #facc15;
            --accent-green: #4ade80;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 頂部導覽列 */
        .top-nav {
            background-color: #1e293b;
            display: flex;
            padding: 0 20px;
            border-bottom: 1px solid #334155;
            height: 60px;
            align-items: center;
        }

        .nav-item {
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--text-dim);
            font-weight: bold;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .nav-item:hover { color: var(--text-main); }
        .nav-item.active {
            color: var(--accent-yellow);
            border-bottom: 3px solid var(--accent-yellow);
        }

        /* 主佈局 */
        .layout-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #334155;
            padding: 20px;
            overflow-y: auto;
        }

        .key-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .key-item.active {
            background-color: #334155;
            color: var(--accent-yellow);
            box-shadow: inset 0 0 0 1px var(--accent-yellow);
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-section { margin-bottom: 30px; }
        .key-title { font-size: 1.8rem; color: var(--accent-yellow); margin: 0; }

        /* 卡片設計 */
        .chords-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .chord-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            border: 1px solid #334155;
            transition: all 0.3s;
        }

        .chord-card:hover { border-color: var(--accent-yellow); background: #232f45; }

        .chord-degree { color: var(--accent-yellow); font-weight: 800; font-size: 1.1rem; margin-bottom: 8px; }
        .chord-name { font-size: 1.6rem; font-weight: bold; margin-bottom: 12px; }

        .notes-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .note-tag {
            background: #0f172a;
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid #334155;
        }

        .btn-play {
            background: linear-gradient(135deg, #facc15, #eab308);
            border: none;
            color: #422006;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-play:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-item active" onclick="switchMode('triad', this)">🎵 調性和弦 (三和弦)</div>
        <div class="nav-item" onclick="switchMode('seventh', this)">🎼 七和弦</div>
    </nav>

    <div class="layout-container">
        <div class="sidebar" id="keySidebar"></div>
        <div class="main-content">
            <div class="header-section">
                <h1 id="currentKeyName" class="key-title">C 大調</h1>
                <p id="modeDesc" style="color: var(--text-dim)">大調順階三和弦</p>
            </div>
            <div class="chords-grid" id="chordContainer"></div>
        </div>
    </div>

<script>
    const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const majorScalePattern = [0, 2, 4, 5, 7, 9, 11];
    
    // 樂理定義
    const config = {
        triad: {
            name: "調性和弦 (三和弦)",
            degrees: ["I", "ii", "iii", "IV", "V", "vi", "vii°"],
            intervals: [[0, 4, 7], [0, 3, 7], [0, 3, 7], [0, 4, 7], [0, 4, 7], [0, 3, 7], [0, 3, 6]],
            suffix: ["", "m", "m", "", "", "m", "dim"]
        },
        seventh: {
            name: "七和弦",
            degrees: ["IMaj7", "iim7", "iiim7", "IVMaj7", "V7", "vim7", "viiø7"],
            intervals: [[0, 4, 7, 11], [0, 3, 7, 10], [0, 3, 7, 10], [0, 4, 7, 11], [0, 4, 7, 10], [0, 3, 7, 10], [0, 3, 6, 10]],
            suffix: ["Maj7", "m7", "m7", "Maj7", "7", "m7", "m7b5"]
        }
    };

    let currentMode = 'triad';
    let currentRoot = 0;

    // --- 鋼琴音色引擎 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playPianoNote(freq) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const duration = 1.5;

        // 建立濾波器讓聲音變溫潤
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(2000, now);
        filter.frequency.exponentialRampToValueAtTime(500, now + duration);

        const mainGain = audioCtx.createGain();
        mainGain.gain.setValueAtTime(0, now);
        mainGain.gain.linearRampToValueAtTime(0.3, now + 0.01); // 打擊感
        mainGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        // 疊加多個泛音 (Harmonics) 模擬鋼琴
        [1, 2, 3, 4].forEach((harmonic, i) => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            
            osc.type = i === 0 ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(freq * harmonic, now);
            
            g.gain.setValueAtTime(0.2 / (i + 1), now);
            
            osc.connect(g);
            g.connect(mainGain);
            osc.start(now);
            osc.stop(now + duration);
        });

        mainGain.connect(filter);
        filter.connect(audioCtx.destination);
    }

    function playChord(rootIndex, degreeIdx) {
        const intervals = config[currentMode].intervals[degreeIdx];
        intervals.forEach(interval => {
            // 計算頻率 (設定在第 4 個八度)
            const freq = 440 * Math.pow(2, (rootIndex + interval - 9) / 12);
            playPianoNote(freq);
        });
    }

    // --- UI 邏輯 ---
    function switchMode(mode, el) {
        currentMode = mode;
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('modeDesc').innerText = config[mode].name;
        renderChords();
    }

    function renderSidebar() {
        const sidebar = document.getElementById('keySidebar');
        notes.forEach((note, i) => {
            const div = document.createElement('div');
            div.className = `key-item ${i === 0 ? 'active' : ''}`;
            div.innerHTML = `<span>${note} 大調</span>`;
            div.onclick = () => {
                document.querySelectorAll('.key-item').forEach(k => k.classList.remove('active'));
                div.classList.add('active');
                currentRoot = i;
                document.getElementById('currentKeyName').innerText = `${note} 大調`;
                renderChords();
            };
            sidebar.appendChild(div);
        });
    }

    function renderChords() {
        const container = document.getElementById('chordContainer');
        const modeData = config[currentMode];
        container.innerHTML = '';

        majorScalePattern.forEach((interval, i) => {
            const chordRoot = currentRoot + interval;
            const card = document.createElement('div');
            card.className = 'chord-card';
            
            // 計算並取得組成音名稱
            const chordNotes = modeData.intervals[i].map(v => notes[(chordRoot + v) % 12]);
            
            card.innerHTML = `
                <div class="chord-degree">${modeData.degrees[i]}</div>
                <div class="chord-name">${notes[chordRoot % 12]}${modeData.suffix[i]}</div>
                <div class="notes-container">
                    ${chordNotes.map(n => `<div class="note-tag">${n}</div>`).join('')}
                </div>
                <button class="btn-play" onclick="playChord(${chordRoot}, ${i})">
                    ▶ 試聽鋼琴聲
                </button>
            `;
            container.appendChild(card);
        });
    }

    // 初始化
    renderSidebar();
    renderChords();
</script>
</body>
</html>
