<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樂理互動探索器 Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #111827;
            --card-bg: #1e293b;
            --accent-yellow: #facc15;
            --accent-green: #4ade80;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --sidebar-width: 240px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 頂部導覽列 */
        .top-nav {
            background-color: #1e293b;
            display: flex;
            padding: 0 15px;
            border-bottom: 1px solid #334155;
            height: 60px;
            align-items: center;
            z-index: 100;
        }

        /* 手機版選單按鈕 */
        .menu-toggle {
            display: none;
            background: none;
            border: 1px solid var(--text-dim);
            color: var(--text-main);
            font-size: 24px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            margin-right: 15px;
        }

        .nav-item {
            padding: 0 15px;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--text-dim);
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }

        .nav-item.active {
            color: var(--accent-yellow);
            border-bottom: 3px solid var(--accent-yellow);
        }

        .layout-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* 側邊欄改為抽屜式 */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid #334155;
            padding: 20px;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 50;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 手機排版調整 */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            
            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%); /* 預設收起來 */
            }

            .sidebar.open {
                transform: translateX(0); /* 打開 */
                box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            }

            .nav-item { padding: 0 10px; font-size: 13px; }
            .key-title { font-size: 1.5rem; }
        }

        .key-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
        }

        .key-item.active {
            background-color: #334155;
            color: var(--accent-yellow);
            box-shadow: inset 0 0 0 1px var(--accent-yellow);
        }

        .chords-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .chord-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            border: 1px solid #334155;
        }

        .chord-name { font-size: 1.3rem; margin-bottom: 10px; }

        .notes-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 15px;
        }

        .note-tag {
            background: #0f172a;
            color: var(--accent-green);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid #334155;
        }

        .btn-play {
            background: var(--accent-yellow);
            border: none;
            color: #422006;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        /* 遮罩層：手機開啟選單時，點擊右側可關閉 */
        .overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 40;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="nav-item active" onclick="switchMode('triad', this)">三和弦</div>
        <div class="nav-item" onclick="switchMode('seventh', this)">七和弦</div>
    </nav>

    <div class="layout-container">
        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
        <div class="sidebar" id="keySidebar"></div>
        <div class="main-content">
            <div class="header-section">
                <h1 id="currentKeyName" class="key-title">C 大調</h1>
                <p id="modeDesc" style="color: var(--text-dim); margin-top: 5px;">大調順階三和弦</p>
            </div>
            <div class="chords-grid" id="chordContainer"></div>
        </div>
    </div>

<script>
    const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const majorScalePattern = [0, 2, 4, 5, 7, 9, 11];
    const config = {
        triad: {
            name: "大調順階三和弦",
            degrees: ["I", "ii", "iii", "IV", "V", "vi", "vii°"],
            intervals: [[0, 4, 7], [0, 3, 7], [0, 3, 7], [0, 4, 7], [0, 4, 7], [0, 3, 7], [0, 3, 6]],
            suffix: ["", "m", "m", "", "", "m", "dim"]
        },
        seventh: {
            name: "自然音階七和弦",
            degrees: ["IMaj7", "iim7", "iiim7", "IVMaj7", "V7", "vim7", "viiø7"],
            intervals: [[0, 4, 7, 11], [0, 3, 7, 10], [0, 3, 7, 10], [0, 4, 7, 11], [0, 4, 7, 10], [0, 3, 7, 10], [0, 3, 6, 10]],
            suffix: ["Maj7", "m7", "m7", "Maj7", "7", "m7", "m7b5"]
        }
    };

    let currentMode = 'triad';
    let currentRoot = 0;

    // 手機選單控制
    function toggleSidebar() {
        const sidebar = document.getElementById('keySidebar');
        const overlay = document.getElementById('overlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playPianoNote(freq) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const duration = 1.2;
        const mainGain = audioCtx.createGain();
        mainGain.gain.setValueAtTime(0, now);
        mainGain.gain.linearRampToValueAtTime(0.2, now + 0.01);
        mainGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        [1, 2, 4].forEach((harmonic, i) => {
            const osc = audioCtx.createOscillator();
            osc.type = i === 0 ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(freq * harmonic, now);
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(0.1 / (i + 1), now);
            osc.connect(g); g.connect(mainGain);
            osc.start(now); osc.stop(now + duration);
        });
        mainGain.connect(audioCtx.destination);
    }

    function playChord(rootIndex, degreeIdx) {
        config[currentMode].intervals[degreeIdx].forEach(interval => {
            const freq = 440 * Math.pow(2, (rootIndex + interval - 9) / 12);
            playPianoNote(freq);
        });
    }

    function switchMode(mode, el) {
        currentMode = mode;
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('modeDesc').innerText = config[mode].name;
        renderChords();
    }

    function renderSidebar() {
        const sidebar = document.getElementById('keySidebar');
        notes.forEach((note, i) => {
            const div = document.createElement('div');
            div.className = `key-item ${i === 0 ? 'active' : ''}`;
            div.innerHTML = `<span>${note} 大調</span>`;
            div.onclick = () => {
                document.querySelectorAll('.key-item').forEach(k => k.classList.remove('active'));
                div.classList.add('active');
                currentRoot = i;
                document.getElementById('currentKeyName').innerText = `${note} 大調`;
                renderChords();
                // 如果是手機版，點選後自動收起選單
                if (window.innerWidth <= 768) toggleSidebar();
            };
            sidebar.appendChild(div);
        });
    }

    function renderChords() {
        const container = document.getElementById('chordContainer');
        const modeData = config[currentMode];
        container.innerHTML = '';
        majorScalePattern.forEach((interval, i) => {
            const chordRoot = currentRoot + interval;
            const card = document.createElement('div');
            card.className = 'chord-card';
            const chordNotes = modeData.intervals[i].map(v => notes[(chordRoot + v) % 12]);
            card.innerHTML = `
                <div class="chord-degree">${modeData.degrees[i]}</div>
                <div class="chord-name">${notes[chordRoot % 12]}${modeData.suffix[i]}</div>
                <div class="notes-container">
                    ${chordNotes.map(n => `<div class="note-tag">${n}</div>`).join('')}
                </div>
                <button class="btn-play" onclick="playChord(${chordRoot}, ${i})">▶ 試聽</button>
            `;
            container.appendChild(card);
        });
    }

    renderSidebar();
    renderChords();
</script>
</body>
</html>
